{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Teacher Directory</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for teacher in teachers %}
            <tr>
                <td>{{ teacher.user.get_full_name }}</td>
                <td>{{ teacher.subject }}</td>
                <td>{{ teacher.user.email }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">No teachers found in the system.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
